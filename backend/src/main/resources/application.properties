# Spring Boot Application
spring.application.name=memory-layer-backend
server.port=8080

# --- Database Configuration (PostgreSQL) ---
# Configure these via environment variables or .env file.
# Do NOT commit real passwords to version control.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/memory_layer}
spring.datasource.username=${DB_USERNAME:memory_user}
spring.datasource.password=${DB_PASSWORD:memory_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT Configuration ---
# JWT secret key - MUST be set via environment variable in production.
# Minimum 32 characters recommended for HS256.
jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logging ---
logging.level.com.memorylayer.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
